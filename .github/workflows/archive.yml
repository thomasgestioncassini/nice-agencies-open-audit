name: archivage

# Phase D : archivage programmé chaque semaine, plus déclenchement manuel.
# Lundi 05:30 UTC : archivage du relevé publié par le site dans la nuit de dimanche à lundi (engagement).
# Mardi 06:30 UTC : tirage au sort, après l'échéance fixe du mardi 06:00 UTC.
on:
  schedule:
    - cron: '30 5 * * 1'
    - cron: '30 6 * * 2'
  workflow_dispatch:
    inputs:
      recalculer:
        description: "Recalculer aussi les relevés qui ont déjà un rapport (nouvelle version du code)"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write        # attestation Sigstore des manifestes
  attestations: write
  actions: read          # lecture des journaux d'exécution : preuve d'engagement des relevés

concurrency:
  group: archivage
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bibliothèque de vérification BLS (empreintes verrouillées)
        run: python -m pip install --require-hashes --no-deps -r requirements-tirage.txt
      - name: Archivage du relevé publié
        run: python -m auditor fetch
      - name: Tirage drand (seulement si l'échéance fixe est passée et l'engagement prouvé par GitHub)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          for s in snapshots/*/; do
            d=$(basename "$s" | cut -c1-10)
            ls snapshots/${d}*/draw.json >/dev/null 2>&1 && continue   # un seul tirage par date de relevé
            python -m auditor draw "$s"; echo "code de sortie $?"
          done
      - name: Recalcul des relevés
        env:
          RECALCULER: ${{ inputs.recalculer }}
        run: |
          set +e
          for s in snapshots/*/; do
            d=$(basename "$s")
            # sans demande de recalcul, un relevé qui a déjà un rapport n'est pas recalculé
            [ "$RECALCULER" != "true" ] && grep -ls "\"snapshot\": \"snapshots/${d}\"" reports/*/manifest.json >/dev/null 2>&1 && continue
            python -m auditor run "$s"; echo "code de sortie $?"
          done
      - name: Vérification des empreintes
        # les rapports canari (test de bout en bout des IA) n'ont pas de manifeste : ils sont signalés, pas vérifiés
        run: |
          set -e
          for r in reports/*/; do
            case "$r" in reports/canari_*) echo "canari, sans manifeste : $r"; continue;; esac
            python -m auditor verify "$r"
          done
      - name: Tests sur les relevés archivés (aucun test sauté accepté)
        env:
          AUDIT_REQUIRE_SNAPSHOT: '1'
          AUDIT_REQUIRE_BLS: '1'
        run: python -m unittest -v
      - name: Nouveaux rapports à attester
        id: nouveaux
        run: |
          L=$(git status --porcelain --untracked-files=all reports | awk '{print $2}' | grep '/manifest.json$' || true)
          { echo 'liste<<FIN'; echo "$L"; echo FIN; } >> "$GITHUB_OUTPUT"
      - name: Attestation Sigstore des manifestes (signature de l'exécution GitHub, inscrite au journal public Rekor)
        id: attestation
        if: steps.nouveaux.outputs.liste != ''
        continue-on-error: true      # un rapport est publié même si l'attestation échoue ; le registre le montre alors sans attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.nouveaux.outputs.liste }}
      - name: Registre des audits
        env:
          LISTE: ${{ steps.nouveaux.outputs.liste }}
          ATTESTE: ${{ steps.attestation.outcome }}
        run: |
          if [ "$ATTESTE" = "success" ]; then python -m auditor attested "$GITHUB_RUN_ID" $LISTE; fi
          python -m auditor registry
      - name: Publication dans le dépôt (aucune relecture)
        run: |
          git config user.name "nice-agencies-open-audit[bot]"
          git config user.email "audit-bot@users.noreply.github.com"
          touch attestations.json 2>/dev/null; [ -s attestations.json ] || echo "{}" > attestations.json
          git add snapshots reports attestations.json REGISTRE.md registre.json
          git diff --cached --quiet && { echo "rien de nouveau"; exit 0; }
          git commit -m "Relevé archivé et rapport (exécution ${GITHUB_RUN_ID})"
          for i in 1 2 3; do git pull --rebase --quiet && git push && break; sleep 5; done
